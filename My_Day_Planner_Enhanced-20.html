<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Day Planner — Enhanced</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#14091C; --surface:rgba(34,12,42,.5); --ink:#FFF2FA; --muted:#D3C3E0; --line:rgba(140,160,255,.2);
  --accent:#FF5CB1; --accent-ink:#1E0414; --accent-soft:rgba(255,92,177,.17);
  --hot:#FF3D8B; --done:#3DFFA2; --done-soft:rgba(61,255,162,.14);
  --warn:#FF5C6C; --warn-soft:rgba(255,92,108,.16); --now:#FFB020; --field:rgba(255,255,255,.07);
  --sc1:#12060F; --sc2:#1E0A1E; --sc3:#2A0B2B;
  --shade:radial-gradient(ellipse at 50% 62%,rgba(255,150,215,.34),transparent 55%),radial-gradient(ellipse at 50% -5%,rgba(255,200,235,.3),transparent 62%),linear-gradient(180deg,rgba(20,6,30,.06),rgba(20,6,30,0) 45%,rgba(20,6,30,.2));
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#EAF0FC; --surface:rgba(255,255,255,.82); --ink:#10172E; --muted:#56628A; --line:rgba(40,60,140,.18);
    --accent:#D6137A; --accent-ink:#FFFFFF; --accent-soft:rgba(214,19,122,.12);
    --hot:#E01F6F; --done:#0E9F62; --done-soft:rgba(14,159,98,.13);
    --warn:#D8283B; --warn-soft:rgba(216,40,59,.12); --now:#D97706; --field:rgba(20,30,80,.06);
    --sc1:#F8E4F0; --sc2:#F6E9F6; --sc3:#F3E9FF;
    --shade:linear-gradient(180deg,rgba(255,240,250,.72),rgba(255,240,250,.55) 40%,rgba(255,240,250,.8));
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EAF0FC; --surface:rgba(255,255,255,.82); --ink:#10172E; --muted:#56628A; --line:rgba(40,60,140,.18);
  --accent:#D6137A; --accent-ink:#FFFFFF; --accent-soft:rgba(214,19,122,.12);
  --hot:#E01F6F; --done:#0E9F62; --done-soft:rgba(14,159,98,.13);
  --warn:#D8283B; --warn-soft:rgba(216,40,59,.12); --now:#D97706; --field:rgba(20,30,80,.06);
  --sc1:#F8E4F0; --sc2:#F6E9F6; --sc3:#F3E9FF;
    --shade:linear-gradient(180deg,rgba(255,240,250,.72),rgba(255,240,250,.55) 40%,rgba(255,240,250,.8));
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.01em}
[hidden]{display:none!important}

/* ---------- night-drive scene ---------- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,var(--sc1) 0%,var(--sc2) 58%,var(--sc3) 100%)}
.scene .photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:1;filter:brightness(1.35) saturate(1.25) contrast(1.06)}
.scene .shade{position:absolute;inset:0;background:var(--shade)}
.petals{display:none}
.car{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(760px,135vw);transform:translateX(-50%);
  opacity:.6;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--accent) 55%,transparent))}
.road{position:absolute;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));height:3px;
  background:repeating-linear-gradient(90deg,var(--line) 0 46px,transparent 46px 100px)}
@media (prefers-reduced-motion:no-preference){
  .road{animation:road 1.1s linear infinite}
  .car{animation:idle 2.6s ease-in-out infinite alternate}
}
@media (prefers-reduced-motion:no-preference){
  .scene .photo{animation:drift 24s ease-in-out infinite alternate}
  .petals{display:block}
  .petals span{position:absolute;top:-40px;font-size:18px;opacity:.75;animation:fall linear infinite}
  .ring.running .prog{animation:glowpulse 1.6s ease-in-out infinite}
}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.1) translateY(-1.5%)}}
@keyframes fall{to{transform:translate(50px,112vh) rotate(360deg)}}
@keyframes glowpulse{50%{filter:drop-shadow(0 0 16px var(--accent))}}
@keyframes road{to{background-position-x:-100px}}
@keyframes idle{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-3px)}}

.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 16px 104px}

/* ---------- top / headings ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.date-nav{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:18px;line-height:1;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.today-btn{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.big-date{font-size:34px;line-height:1.05;margin:2px 0 4px;text-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.sub,.section>h2,.group-title,.foot,.empty{text-shadow:0 1px 10px var(--bg),0 0 3px var(--bg)}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;justify-content:center}
.tab{flex:1;max-width:130px;padding:10px 4px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--muted);font-family:var(--display)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}

/* ---------- cards & rows ---------- */
.glass,.card,.row{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{border-radius:20px;padding:14px;margin-bottom:16px}
.section{margin-bottom:24px}
.section>h2{font-size:19px;margin-bottom:10px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.row{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:500;overflow-wrap:anywhere}
.row .meta,.meta{font-size:13px;color:var(--muted)}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--field);color:transparent;font-size:15px;font-weight:700}
.check[aria-checked="true"]{background:var(--done);border-color:var(--done);color:var(--bg)}
.del{color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;flex:none}
.del:hover{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--done-soft);color:var(--done)}
.group-title{font-size:14px;font-weight:700;margin:16px 0 8px;color:var(--muted);font-family:var(--display)}

/* ---------- forms ---------- */
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;border-radius:16px;padding:10px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.add input[type=text]{flex:1 1 180px;min-width:0}
.add label,.field label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;width:100%}
.add input[type=date],.add input[type=time]{width:auto}
select option{color:#10172E}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-weight:700;min-height:42px;font-family:var(--display);
  box-shadow:0 0 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ghost{background:var(--field);color:var(--ink);box-shadow:none;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn.ghost{position:relative;overflow:hidden}
.file-over{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn.hot{background:var(--hot);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--hot) 45%,transparent)}
.btn.danger{background:var(--warn);color:#fff;box-shadow:none}

/* ---------- avatars, tutor, mentor ---------- */
.char{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:start}
.avatar-btn{display:block;width:104px;height:104px;border-radius:50%}
.avatar{width:104px;height:104px;position:relative}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:2px solid var(--accent);background:#171c3a;
  box-shadow:0 0 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.face img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 40%}
.face::after,.face::before{content:"";position:absolute;inset:0;pointer-events:none}
.fx{position:absolute;font-size:22px;line-height:1;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));z-index:2}
.fx1{top:-10px;right:-8px}.fx2{top:8px;left:-12px}.fx3{bottom:14px;left:-10px}
.avatar .badge{position:absolute;right:-4px;bottom:-4px;font-size:24px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));z-index:3}
.face .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:900 15px/1 Impact,"Arial Black",sans-serif;color:#fff;letter-spacing:.5px;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;z-index:2}
.mood-love .face{border-color:var(--hot);box-shadow:0 0 24px color-mix(in srgb,var(--hot) 65%,transparent)}
.mood-love .face img{filter:brightness(1.08) saturate(1.25)}
.mood-love .face::after{background:radial-gradient(circle at 50% 75%,rgba(255,80,160,.38),transparent 70%)}
.mood-proud .face{border-color:var(--hot)}
.mood-proud .face img{filter:brightness(1.08) saturate(1.1)}
.mood-happy .face img{filter:brightness(1.1) saturate(1.15)}
.mood-happy .face::after{background:radial-gradient(circle at 50% 25%,rgba(255,240,180,.32),transparent 70%)}
.mood-annoyed .face{border-color:var(--muted)}
.mood-annoyed .face img{filter:grayscale(.45) brightness(.92)}
.mood-annoyed .face::after{background:rgba(40,40,90,.28)}
.mood-angry .face{border-color:var(--warn);box-shadow:0 0 26px color-mix(in srgb,var(--warn) 70%,transparent)}
.mood-angry .face img{filter:saturate(1.5) contrast(1.12) hue-rotate(-12deg)}
.mood-angry .face::after{background:rgba(255,30,50,.4)}
.mood-meme .face{border-color:var(--now);box-shadow:0 0 26px color-mix(in srgb,var(--now) 70%,transparent)}
.mood-meme .face img{filter:contrast(1.35) saturate(1.8)}
.mood-meme .face::after{background:radial-gradient(circle,transparent 38%,rgba(255,170,0,.45))}
.mood-calm .face{border-color:var(--muted);box-shadow:0 0 18px rgba(147,160,196,.4)}
.mood-calm .face::before{background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-100%)}
@media (prefers-reduced-motion:no-preference){
  .avatar.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
  .mood-neutral .face img,.mood-calm .face img,.mood-proud .face img{animation:breathe 4s ease-in-out infinite}
  .mood-calm .face::before{animation:sweep 6s ease-in-out infinite}
  .mood-love .face img{animation:heartbeat 1.1s ease-in-out infinite}
  .mood-happy .face{animation:bounce .9s ease-in-out infinite}
  .mood-annoyed .face img{animation:sideeye 3.2s ease-in-out infinite}
  .mood-angry .face{animation:shake .4s linear infinite}
  .mood-angry .face::after{animation:pulsered .8s ease-in-out infinite}
  .mood-meme .face{animation:shake .25s linear infinite}
  .mood-meme .face img{animation:zoompunch .5s ease-in-out infinite alternate}
  .mood-love .fx{animation:rise 2.4s ease-out infinite}
  .mood-love .fx2{animation-delay:.8s}.mood-love .fx3{animation-delay:1.6s}
  .mood-happy .fx,.mood-proud .fx{animation:twinkle 1.4s ease-in-out infinite}
  .mood-happy .fx2,.mood-proud .fx2{animation-delay:.5s}.mood-happy .fx3{animation-delay:.9s}
  .mood-annoyed .fx{animation:drip 2s ease-in infinite}
  .mood-annoyed .fx2{animation:throb 1.2s ease-in-out infinite}
  .mood-angry .fx{font-size:28px;animation:throb .5s ease-in-out infinite}
  .mood-angry .fx2{animation-delay:.25s}
  .mood-meme .fx{font-size:26px;animation:wobble .35s ease-in-out infinite}
  .mood-meme .fx2{animation-delay:.15s}.mood-meme .fx3{animation-delay:.3s}
}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sideeye{0%,100%{transform:translateX(0) rotate(0)}40%,60%{transform:translateX(-4px) rotate(-3deg)}}
@keyframes zoompunch{from{transform:scale(1.1)}to{transform:scale(1.38)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-1deg)}75%{transform:translateX(2px) rotate(1deg)}}
@keyframes pulsered{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes rise{0%{transform:translateY(10px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translateY(-16px) scale(1.15);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.25) rotate(20deg);opacity:1}}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes throb{0%,100%{transform:scale(1) rotate(-8deg)}50%{transform:scale(1.35) rotate(8deg)}}
@keyframes wobble{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(14deg) scale(1.25)}}
.bubble{position:relative;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:26px;width:12px;height:12px;background:var(--field);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble .who{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-family:var(--display)}
.bubble p{margin:0 0 8px;font-size:15px}
.bubble blockquote{margin:0 0 6px;font-size:15.5px;font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;box-shadow:0 0 10px var(--accent)}
.card.pun{border-color:var(--warn);background:linear-gradient(0deg,var(--warn-soft),var(--warn-soft)),var(--surface)}
.card.pun h2{font-size:18px;margin-bottom:6px;color:var(--warn)}
.card.pun .what{font-size:16px;font-weight:600;margin:8px 0 6px}
.card.pun .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- habit week strip ---------- */
.week{display:flex;gap:4px;margin-top:8px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0;border-radius:8px}
.day .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent;background:var(--field)}
.day[aria-checked="true"] .dot{background:var(--done);border-color:var(--done);color:var(--bg)}
.day[aria-disabled="true"]{opacity:.3;pointer-events:none}
.day.is-today span{color:var(--accent);font-weight:700}

/* ---------- schedule ---------- */
.timeline{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hour{display:grid;grid-template-columns:58px 1fr;border-top:1px solid var(--line);min-height:46px;position:relative}
.hour:first-child{border-top:0}
.hour .label{padding:11px 0 0 12px;font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.hour .slot{padding:6px 10px 6px 10px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);justify-content:center}
.hour.is-now{background:linear-gradient(90deg,color-mix(in srgb,var(--now) 14%,transparent),transparent 75%)}
.hour.is-now .label{color:var(--now)}
.hour.is-now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--now);box-shadow:0 0 10px var(--now)}
.plan{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:10px;padding:6px 8px}
.plan .time{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.plan .name{flex:1;font-weight:500;overflow-wrap:anywhere}
.plan.done{background:var(--done-soft)}
.plan.done .name{text-decoration:line-through;color:var(--muted)}
.plan.done .time{color:var(--done)}
.plan.late{background:var(--warn-soft)}
.plan.late .time{color:var(--warn)}
.plan .check{width:22px;height:22px;border-radius:7px;font-size:13px}
.plan .del{width:28px;height:28px;font-size:16px}
.add-slot{text-align:left;color:var(--muted);font-size:13.5px;padding:5px 0;border-radius:8px;width:100%}
.add-slot:hover{color:var(--accent)}
.slot-form{display:flex;gap:6px;flex-wrap:wrap}
.slot-form input[type=time]{width:128px}
.slot-form input[type=text]{flex:1 1 140px;min-width:0}
.slot-form input,.slot-form .btn{min-height:38px;padding-top:6px;padding-bottom:6px}

/* ---------- focus ---------- */
.ring{position:relative;width:min(250px,68vw);margin:6px auto 12px}
.ring svg{display:block;width:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:10}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--accent))}
.ring .time{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--display);font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .time small{display:block;font-size:13px;font-weight:500;color:var(--muted);font-family:var(--body);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field>span{font-size:13px;color:var(--muted)}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn-row .btn{min-width:120px}
.pill{position:sticky;top:8px;z-index:4;display:flex;justify-content:center;margin-bottom:10px}
.pill button{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 16px;font-weight:700;font-family:var(--display);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 50%,transparent)}
.chart{display:flex;gap:8px;height:120px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.col .wrap{flex:1;display:flex;align-items:flex-end;width:100%}
.col .wrap i{display:block;width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}

/* ---------- settings ---------- */
.preview{width:64px;height:64px;border-radius:50%;background-size:cover;background-position:center;background-color:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}

/* ===== Enhanced productivity layer — keeps the original scene + motion intact ===== */
.command{position:relative;overflow:hidden;margin-bottom:18px;
  border:1px solid color-mix(in srgb,var(--accent) 44%,var(--line));
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035)),var(--surface);
  box-shadow:0 10px 34px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.16)}
.command::before{content:"";position:absolute;inset:-40% -10%;
  background:radial-gradient(circle at 15% 30%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 38%),
             radial-gradient(circle at 90% 20%,rgba(95,150,255,.16),transparent 34%);
  pointer-events:none}
.command>*{position:relative;z-index:1}
.command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.command-kicker{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:4px}
.command-title{font:800 clamp(24px,6vw,34px)/1.05 var(--display);margin:0}
.command-sub{font-size:13px;color:var(--muted);margin:6px 0 0}
.command-ring{width:78px;height:78px;flex:none;position:relative}

.command-ring circle{fill:none;stroke-width:8}

.command-ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 17px var(--display)}
.ec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ec-stat{padding:10px;border-radius:12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}
.ec-stat b{display:block;font:800 22px var(--display)}
.ec-stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.command-next{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 11px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.command-next .grow{min-width:0}
.command-next .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.command-actions .btn{flex:1;min-width:130px}
.quick-fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;
  border-radius:999px!important;padding:11px 16px!important;min-height:44px;
  background:linear-gradient(135deg,var(--hot),var(--accent))!important;color:#fff!important;
  box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.25)!important}
.quick-fab:hover{transform:translateY(-2px)}
.quick-modal{position:fixed;inset:0;z-index:30;display:none;place-items:end center;padding:18px;background:rgba(5,2,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.quick-modal.open{display:grid}
.quick-panel{width:min(520px,100%);border-radius:22px;padding:14px;background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.05)),var(--surface);
  border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));
  box-shadow:0 18px 70px rgba(0,0,0,.38);animation:quickIn .22s ease-out}
@keyframes quickIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.quick-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.quick-head h2{font-size:20px}
.quick-close{width:36px;height:36px;border-radius:50%;background:var(--field);border:1px solid var(--line)}
.quick-tabs{display:flex;gap:6px;margin-bottom:10px}
.quick-tab{flex:1;padding:9px 10px;border-radius:10px;background:var(--field);border:1px solid var(--line);font-weight:700;color:var(--muted)}
.quick-tab.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}
.quick-form{display:grid;gap:9px}
.quick-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick-help{font-size:11px;color:var(--muted);margin-top:2px}
.priority{font-size:11px!important;padding:3px 8px!important;margin-left:6px}
.priority-high{background:var(--warn-soft)!important;color:var(--warn)!important}
.priority-medium{background:color-mix(in srgb,var(--now) 18%,transparent)!important;color:var(--now)!important}
.priority-low{background:var(--done-soft)!important;color:var(--done)!important}
.enhanced-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
@media(max-width:520px){
  .ec-grid{grid-template-columns:1fr 1fr 1fr}
  .command-title{font-size:26px}
  .command-ring{width:66px;height:66px}
  .quick-panel{border-radius:22px 22px 12px 12px}
}
@media(min-width:641px){
  .quick-modal{place-items:center}
  .quick-panel{width:min(560px,calc(100vw - 48px))}
}
@media(prefers-reduced-motion:reduce){
  .quick-panel{animation:none}
}

  function connectDb(){
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var d=r[0],u=r[1];
      if(!d||!u||!u.id)return;
      return u.id().then(function(id){
        if(!id)return;
        docRef=d.doc('data/users/'+id+'/planner');
        return docRef.get().then(function(snap){
          if(snap.exists){
            var data=snap.data()||{};
            if(data.s&&(data.updatedAt||0)>state.updatedAt){
              try{state=normalize(JSON.parse(data.s));lsWrite();render()}catch(e){}
            } else if(state.updatedAt>(data.updatedAt||0)){save()}
          } else if(state.habits.length||state.tasks.length||Object.keys(state.plans).length){save()}
        });
      });
    }).catch(function(){});
  }

  function readImage(file,max,square,cb){
    var fr=new FileReader();
    fr.onerror=function(){cb(null)};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){cb(null)};
      img.onload=function(){
        var c=document.createElement('canvas'),ctx=c.getContext('2d');
        if(square){
          var s=Math.min(img.width,img.height);
          c.width=c.height=max;
          ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,max,max);
        } else {
          var k=Math.min(1,max/Math.max(img.width,img.height));
          c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
          ctx.drawImage(img,0,0,c.width,c.height);
        }
        cb(c.toDataURL('image/jpeg',0.8));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }

  function habitActive(hb,d){return d>=hb.start&&(!hb.end||d<=hb.end)}
  function streak(hb){
    var t=todayStr(),d=hb.days[t]?t:addDays(t,-1),n=0;
    while(hb.days[d]&&habitActive(hb,d)){n++;d=addDays(d,-1)}
    return n;
  }
  function toggleHabit(hb,d){
    if(hb.days[d])delete hb.days[d];else hb.days[d]=true;
    save();render();
  }
  function sortedPlans(d){return (state.plans[d]||[]).slice().sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0})}
  function dayStats(date){
    var t=0,d=0,today=todayStr();
    state.habits.forEach(function(hb){if(habitActive(hb,date)){t++;if(hb.days[date])d++}});
    state.tasks.forEach(function(k){
      if(k.due===date){t++;if(k.done)d++}
      else if(date===today&&k.due&&k.due<date&&!k.done){t++}
    });
    (state.plans[date]||[]).forEach(function(p){t++;if(p.done)d++});
    return {total:t,done:d};
  }
  function computeMood(){
    var now=new Date(),today=todayStr(),st=dayStats(today);
    var hr=now.getHours()+now.getMinutes()/60,nowMin=now.getHours()*60+now.getMinutes();
    var overdue=state.tasks.filter(function(k){return !k.done&&k.due&&k.due<today}).length;
    var missed=(state.plans[today]||[]).filter(function(p){return !p.done&&toMin(p.time)<nowMin-30}).length;
    if(st.total===0)return {mood:'neutral',st:st,empty:true};
    var ratio=st.done/st.total,exp=Math.min(1,Math.max(0,(hr-6)/16)),mood;
    if(st.done===st.total)mood='love';
    else if(ratio>=0.6)mood='happy';
    else if((hr>=20&&ratio<0.5)||overdue>=3||missed>=4)mood='meme';
    else if(overdue>0||missed>=2||ratio<exp-0.25)mood='angry';
    else if(missed>=1||ratio<exp)mood='annoyed';
    else mood='neutral';
    return {mood:mood,st:st,empty:false};
  }
  function focusMinutes(date){
    return state.focus.reduce(function(s,f){return f.date===date?s+f.minutes:s},0);
  }
  function focusStreak(){
    var t=todayStr(),d=focusMinutes(t)>0?t:addDays(t,-1),n=0;
    while(focusMinutes(d)>0){n++;d=addDays(d,-1)}
    return n;
  }

  function pendingPunishments(){
    var today=todayStr(),out=[],i,d,st,ratio,sev;
    var checks=[];
    for(i=3;i>=1;i--)checks.push(addDays(today,-i));
    if(new Date().getHours()>=21)checks.push(today);
    checks.forEach(function(date){
      if(state.served[date])return;
      st=dayStats(date);
      if(st.total===0||st.done>=st.total)return;
      ratio=st.done/st.total;
      sev=ratio>=0.5?'light':ratio>=0.25?'medium':'heavy';
      var list=PUN[sev];
      out.push({date:date,st:st,sev:sev,text:list[hash(date)%list.length]});
    });
    return out;
  }

    }
    out.push(h('div',{class:'card'},
      h('h2',{text:'Your own pictures',style:'font-size:18px;margin-bottom:4px'}),
      h('p',{class:'meta',style:'margin:0 0 12px',text:'Your pictures are already in. Upload new ones any time and they stay on this device.'}),
      picker('tutor',s.tutor+' (tutor face)',256,true,thumb('tutor')),
      picker('mentor',s.mentor+' (mentor face)',256,true,thumb('mentor')),
      picker('bg','Background',1280,false,thumb('bg'))));

    var served=Object.keys(state.served).length;
    out.push(h('div',{class:'card'},
      h('h2',{text:'Punishments',style:'font-size:18px;margin-bottom:6px'}),
      h('p',{class:'meta',style:'margin:0 0 8px',text:served+' completed so far · '+(state.consequences||[]).filter(function(x){return !x.done}).length+' custom consequences active.'}),
      h('p',{style:'margin:0;font-size:14px',text:'They run on the honour system, so they only work if you do them. Each one ends with doing the skipped task, because the aim is to fix the habit, not to make you suffer. Missed days from the last 3 days can come back to you; older ones are forgiven.'})));
    return out;
  }

  /* ================= render ================= */
  var TABS=[['today','Today'],['focus','Focus'],['goals','Targets'],['coach','Ayanokoji'],['habits','Habits'],['tasks','Tasks'],['me','Me']];
  function render(){
    var app=document.getElementById('app');
    var views={today:viewToday,focus:viewFocus,goals:viewGoals,coach:viewCoach,habits:viewHabits,tasks:viewTasks,me:viewMe};
    var nodes=flat(views[ui.tab]());
    var pill=timer&&ui.tab!=='focus'?h('div',{class:'pill'},h('button',{id:'pill-text',onclick:function(){ui.tab='focus';render();window.scrollTo(0,0)},text:'Focus '+mmss(remainingSec())+' · tap to open'})):null;
    var all=[pill].concat(nodes,[h('p',{class:'foot',text:'Saved on this device'+(docRef?' and to your account':'')+'.'})]).filter(Boolean);
    app.replaceChildren.apply(app,all);
    var tabs=document.getElementById('tabs');
    tabs.replaceChildren.apply(tabs,TABS.map(function(t){
      return h('button',{class:'tab',role:'tab','aria-selected':ui.tab===t[0]?'true':'false',onclick:function(){ui.tab=t[0];render();window.scrollTo(0,0)},text:t[1]});
    }));
    var inp=document.getElementById('slot-input');
    if(inp)inp.focus();
  }


/* ================= enhanced productivity layer ================= */
(function(){
  var __oldToday=viewToday;
  var __oldMe=viewMe;
  var __oldTaskRow=taskRow;

  function bestHabitStreak(){
    var n=0;
    state.habits.forEach(function(hb){n=Math.max(n,streak(hb));});
    return n;
  }
  function dayPlanStats(){
    var d=todayStr();
    var hs=state.habits.filter(function(hb){return habitActive(hb,d);});
    var ht=hs.length,hd=hs.filter(function(hb){return hb.days[d];}).length;
    var tasks=state.tasks.filter(function(t){return !t.done && t.due===d;});
    var allTasks=state.tasks.filter(function(t){return !t.done && t.due===d;});
    var td=state.tasks.filter(function(t){return t.done && t.due===d;}).length;
    var ps=state.plans[d]||[], pd=ps.filter(function(p){return p.done;}).length;
    var total=ht+allTasks.length+ps.length;
    var done=hd+td+pd;
    return {ht:ht,hd:hd,taskTotal:allTasks.length,taskDone:td,pt:ps.length,pd:pd,total:total,done:done};
  }
  function nextAction(){
    var d=todayStr(), now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
    var overdue=state.tasks.filter(function(t){return !t.done&&t.due&&t.due<d;}).sort(function(a,b){return (a.due||'').localeCompare(b.due||'');});
    if(overdue[0])return {kind:'task',id:overdue[0].id,label:overdue[0].name,meta:'Overdue task'};
    var due=state.tasks.filter(function(t){return !t.done&&t.due===d;}).sort(function(a,b){return (a.priority||2)-(b.priority||2)||a.name.localeCompare(b.name);});
    if(due[0])return {kind:'task',id:due[0].id,label:due[0].name,meta:'Due today'};
    var plans=(state.plans[d]||[]).filter(function(p){return !p.done&&toMin(p.time)>=nowMin;}).sort(function(a,b){return toMin(a.time)-toMin(b.time);});
    if(plans[0])return {kind:'plan',id:plans[0].id,label:plans[0].text,meta:'Next block · '+clock12(plans[0].time)};
    var hbs=state.habits.filter(function(hb){return habitActive(hb,d)&&!hb.days[d];});
    if(hbs[0])return {kind:'habit',id:hbs[0].id,label:hbs[0].name,meta:'Habit due today'};
    return null;
  }
  function commandCenter(){
    var s=state.settings||{}, ds=dayPlanStats(), focus=focusMinutes(todayStr()), goal=Math.max(5,+s.goal||60);
    var pct=ds.total?Math.round(ds.done/ds.total*100):0;
    var name=(s.name||'').trim(), hour=new Date().getHours();
    var greet=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
    var who=name?(', '+name):'';
    var next=nextAction();
    var nextText=next?next.label:'Nothing urgent. Use this time to build momentum.';
    var nextMeta=next?next.meta:'Start a focused session or plan your next block.';
    var radius=30,circ=2*Math.PI*radius,off=circ*(1-pct/100);
    var ring=document.createElement('div');
    ring.className='command-ring';
    ring.innerHTML='<svg viewBox="0 0 76 76" aria-hidden="true"><circle class="track" cx="38" cy="38" r="'+radius+'"></circle><circle class="prog" cx="38" cy="38" r="'+radius+'" stroke-dasharray="'+circ.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"></circle></svg>';
    ring.appendChild(h('b',{text:pct+'%'}));
    var c=h('div',{class:'card command'},
      h('div',{class:'command-head'},
        h('div',{},
          h('div',{class:'command-kicker',text:'Command center'}),
          h('h2',{class:'command-title',text:greet+who}),
          h('p',{class:'command-sub',text:'Win the next block. Ignore the rest for now.'})),
        ring),
      h('div',{class:'ec-grid'},
        h('div',{class:'ec-stat'},h('b',{text:ds.done+'/'+ds.total}),h('span',{text:'day done'})),
        h('div',{class:'ec-stat'},h('b',{text:String(focus)}),h('span',{text:'focus min'})),
        h('div',{class:'ec-stat'},h('b',{text:String(Math.max(bestHabitStreak(),focusStreak()))}),h('span',{text:'best streak'}))),
      h('div',{class:'command-next'},
        h('div',{style:'font-size:20px',text:next?'→':'✦'}),
        h('div',{class:'grow'},h('div',{class:'meta',text:'NEXT MOVE'}),h('div',{class:'name',text:nextText}),h('div',{class:'meta',text:nextMeta}))),
      h('div',{class:'command-actions'},
        h('button',{class:'btn',onclick:function(){
          if(next){
            if(next.kind==='task'){ui.fLink='task:'+next.id;ui.fLabel=next.label;}
            else if(next.kind==='plan'){ui.fLink='plan:'+todayStr()+':'+next.id;ui.fLabel=next.label;}
            else {ui.fLink='habit:'+next.id;ui.fLabel=next.label;}
          }else{ui.fLink='';ui.fLabel='';}
          ui.mins=25;ui.tab='focus';render();window.scrollTo(0,0);
        },text:next?'Start 25-min focus':'Start focus'}),
        h('button',{class:'btn ghost',onclick:function(){openQuick('task')},text:'+ Quick task'})),
      h('div',{style:'display:flex;justify-content:flex-end;margin-top:9px'},h('span',{class:'enhanced-badge',text:'Enhanced mode'}))
    );
    return c;
  }

  viewToday=function(){
    var r=__oldToday();
    if(ui.sel===todayStr()){r.unshift(countdownCard(activeGoal()));r.unshift(commandCenter());}
    return r;
  };

  taskRow=function(t,showDue){
    var row=__oldTaskRow(t,showDue);
    if(!row||!t.priority)return row;
    var grow=row.querySelector('.grow');
    if(grow){
      var p=t.priority===1?'HIGH':t.priority===3?'LOW':'MED';
      var cl=t.priority===1?'priority-high':t.priority===3?'priority-low':'priority-medium';
      grow.insertBefore(h('span',{class:'tag priority '+cl,text:p}),grow.querySelector('.meta'));
    }
    return row;
  };

  function enhancedMeTools(){
    var file=h('input',{type:'file',accept:'application/json',hidden:true,onchange:function(e){
      var f=e.target.files&&e.target.files[0];if(!f)return;
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var incoming=JSON.parse(fr.result);
          if(!incoming||typeof incoming!=='object'||(!incoming.tasks&&!incoming.habits&&!incoming.plans))throw Error('invalid');
          state=normalize(incoming);save();ui.notice='Backup imported successfully.';render();
        }catch(err){ui.notice='That backup file could not be imported.';render();}
      };
      fr.readAsText(f);e.target.value='';
    }});
    return h('div',{class:'card'},
      h('h2',{text:'Backup & controls',style:'font-size:18px;margin-bottom:5px'}),
      h('p',{class:'meta',text:'Keep your planner safe and make the daily workflow faster.'}),
      h('div',{class:'btn-row'},
        h('button',{class:'btn',onclick:function(){
          var payload=JSON.stringify(state,null,2),blob=new Blob([payload],{type:'application/json'});
          var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='day-planner-backup-'+todayStr()+'.json';a.click();
          setTimeout(function(){URL.revokeObjectURL(a.href)},500);
        },text:'Export backup'}),
        h('label',{class:'btn ghost',style:'position:relative;overflow:hidden'},'Import backup',file)));
  }

  viewMe=function(){
    var r=__oldMe();
    r.push(enhancedMeTools());
    return r;
  };

  var quick={el:null,mode:'task'};
  function closeQuick(){
    if(quick.el)quick.el.classList.remove('open');
  }
  function openQuick(mode){
    ensureQuick();
    quick.mode=mode||'task';
    quick.el.classList.add('open');
    var tab=quick.el.querySelectorAll('.quick-tab');
    tab.forEach(function(x){x.classList.toggle('on',x.dataset.mode===quick.mode)});
    quick.el.querySelectorAll('.quick-pane').forEach(function(x){x.hidden=x.dataset.mode!==quick.mode});
    setTimeout(function(){
      var first=quick.el.querySelector('.quick-pane:not([hidden]) input');
      if(first)first.focus();
    },30);
  }
  function ensureQuick(){
    if(quick.el)return;
    var modal=document.createElement('div');modal.className='quick-modal';modal.id='quickModal';
    var taskName=h('input',{type:'text',maxlength:'120',placeholder:'What needs doing?','aria-label':'Task name'});
    var taskDue=h('input',{type:'date','aria-label':'Due date',value:todayStr()});
    var priority=h('select',{'aria-label':'Priority'});
    ['1|High','2|Medium','3|Low'].forEach(function(x){var p=x.split('|');priority.appendChild(h('option',{value:p[0],text:p[1]}));});
    var habitName=h('input',{type:'text',maxlength:'80',placeholder:'Habit name','aria-label':'Habit name'});
    var until=h('input',{type:'date','aria-label':'Track until'});
    var taskForm=h('form',{class:'quick-form quick-pane','data-mode':'task',onsubmit:function(e){
      e.preventDefault();var n=taskName.value.trim();if(!n)return;
      state.tasks.push({id:uid(),name:n,due:taskDue.value||todayStr(),done:false,priority:+priority.value});
      save();taskName.value='';closeQuick();ui.tab='today';ui.sel=todayStr();render();
    }},
      taskName,h('div',{class:'row2'},h('div',{},h('div',{class:'meta',text:'Due date',style:'margin-bottom:4px'}),taskDue),h('div',{},h('div',{class:'meta',text:'Priority',style:'margin-bottom:4px'}),priority)),
      h('button',{class:'btn',type:'submit',text:'Add task'}),h('div',{class:'quick-help',text:'Tip: pressing / opens this panel anywhere.'}));
    var habitForm=h('form',{class:'quick-form quick-pane','data-mode':'habit',hidden:true,onsubmit:function(e){
      e.preventDefault();var n=habitName.value.trim();if(!n)return;
      state.habits.push({id:uid(),name:n,start:todayStr(),end:until.value||'',days:{}});
      save();habitName.value='';closeQuick();ui.tab='habits';render();
    }},habitName,h('div',{},h('div',{class:'meta',text:'Track until (optional)',style:'margin-bottom:4px'}),until),
      h('button',{class:'btn',type:'submit',text:'Add habit'}));
    var panel=h('div',{class:'quick-panel'},
      h('div',{class:'quick-head'},h('h2',{text:'Quick add'}),h('button',{class:'quick-close',type:'button',onclick:closeQuick,text:'×'})),
      h('div',{class:'quick-tabs'},
        h('button',{class:'quick-tab on',type:'button','data-mode':'task',onclick:function(){openQuick('task')},text:'Task'}),
        h('button',{class:'quick-tab',type:'button','data-mode':'habit',onclick:function(){openQuick('habit')},text:'Habit'})),
      taskForm,habitForm);
    modal.appendChild(panel);
    modal.addEventListener('click',function(e){if(e.target===modal)closeQuick()});
    document.body.appendChild(modal);
    quick.el=modal;
  }

  var fab=document.createElement('button');
  fab.className='quick-fab';fab.id='quickFab';fab.type='button';fab.textContent='＋ Quick';fab.setAttribute('aria-label','Quick add');
  fab.addEventListener('click',function(){openQuick('task')});
  document.body.appendChild(fab);
  ensureQuick();

  document.addEventListener('keydown',function(e){
    var tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
    var typing=tag==='input'||tag==='textarea'||tag==='select'||document.activeElement&&document.activeElement.isContentEditable;
    if(e.key==='Escape'){closeQuick();return}
    if(typing)return;
    if(e.key==='/'){e.preventDefault();openQuick('task');return}
    if(e.key.toLowerCase()==='t'){ui.tab='today';ui.sel=todayStr();render();window.scrollTo(0,0)}
    else if(e.key.toLowerCase()==='f'){ui.tab='focus';render();window.scrollTo(0,0)}
    else if(e.key.toLowerCase()==='h'){ui.tab='habits';render();window.scrollTo(0,0)}
    else if(e.key.toLowerCase()==='k'){ui.tab='tasks';render();window.scrollTo(0,0)}
    else if(e.key.toLowerCase()==='g'){ui.tab='goals';render();window.scrollTo(0,0)}
    else if(e.key.toLowerCase()==='a'){ui.tab='coach';render();window.scrollTo(0,0)}
  });

  /* Default priority for legacy tasks; does not alter their existing meaning. */
  state.tasks.forEach(function(t){if(!t.priority)t.priority=2;});
  save();
})();


  applyBg();
  render();
  if(timer&&timer.status==='running'&&remainingSec()<=0)finishTimer();
  var nr=document.getElementById('now-row');
  if(nr&&ui.tab==='today'){setTimeout(function(){try{nr.scrollIntoView({block:'center'})}catch(e){}},150)}
  connectDb();
})();
</script>
</body>
</html>
